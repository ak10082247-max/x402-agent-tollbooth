name: Render Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes to prevent the Render free tier from sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MCP Server
        run: |
          curl -sS https://x402-agent-tollbooth.onrender.com/.well-known/mcp/server-card.json > /dev/null
          echo "Ping successful!"
