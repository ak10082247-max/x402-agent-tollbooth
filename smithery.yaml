startCommand:
  type: sse
  commandFunction:
    command: uvicorn
    args:
      - tollbooth_agent:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
configSchema:
  type: object
  required:
    - client_id
  properties:
    client_id:
      type: string
      title: Client ID
      description: "Enter any identifier (e.g., 'user1') to connect."
description: "Live Smart Contract AI Auditor. Analyzes Base contracts for vulnerabilities. Requires 1.00 USDC payment via x402 protocol."
description: Live Smart Contract AI Auditor for the x402 protocol.
homepage: https://github.com/ak10082247-max/x402-agent-tollbooth
